name: Build and Publish Docker image

on:
  push:
    branches: [ master ]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'data/**'
      - 'tnr/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, labeled]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'data/**'
      - 'tnr/**'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get branch name
        id: branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-container'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and (optionally) push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-container')) }}
          tags: |
            ${{ github.event_name == 'push' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ${{ format('ghcr.io/{0}:{1}-{2}', github.repository, steps.branch.outputs.name, steps.timestamp.outputs.ts) }}
          labels: ${{ steps.meta.outputs.labels }}